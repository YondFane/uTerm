[package]
name = "uterm"
version = "0.2.12"
edition = "2021"
publish = false
description = "uTerm cross-platform desktop client"
license = "PolyForm-Noncommercial-1.0.0"

[features]
qa = []

[[bin]]
name = "uterm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt"] }
glob = "0.3"
quick-xml = "0.38"
anyhow = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
utermd-local = { path = "../crates/utermd-local" }
uterm-core = { path = "../crates/uterm-core" }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "socks",
] }
ignore = "0.4"
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
minisign-verify = "0.2.5"
semver = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-clipboard-manager = "~2.3.3"
