[package]
name = "uterm"
version = "0.1.25"
edition = "2021"
publish = false
description = "uTerm cross-platform desktop client"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "uterm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
russh-sftp = { version = "3.0.1", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt"] }
glob = "0.3"
anyhow = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
utermd-local = { path = "../crates/utermd-local" }
serde_json = "1.0.151"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
ignore = "0.4"
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
minisign-verify = "0.2.5"
semver = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1.26.1", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "=2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }
