[package]
name = "uterm-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
schemars = "=1.2.2"
regex = "1"
utermd-local = { path = "../utermd-local" }
base64 = "0.22"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = "=0.4.46"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
quick-xml = "=0.38.4"
tokio = { version = "1", features = ["fs", "io-util", "time", "rt", "macros"] }
glob = "0.3"
