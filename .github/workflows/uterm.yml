name: uTerm

on:
  workflow_dispatch:
  pull_request:
    branches: [release]
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUST_TEST_THREADS: 4
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Record source and platform
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ci-evidence
          {
            echo "pr_head=$PR_HEAD_SHA"
            echo "tested_commit=$(git rev-parse HEAD)"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
          } | tee ci-evidence/source.txt
          cp docs/native-migration.md ci-evidence/
          cp shared/contracts/tauri-baseline.json ci-evidence/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.22.0
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        # Test concurrency does not change compiled dependencies; keep it out of the cache key.
        # 测试并发数不改变依赖编译结果，因此不纳入缓存键。
        env:
          RUST_TEST_THREADS: ""
        with:
          shared-key: desktop-${{ matrix.os }}-${{ runner.arch }}
          save-if: false
          workspaces: |
            src-tauri -> target
            crates/utermd-local -> target
            crates/uterm-core -> target
            crates/uterm-ffi -> target
          cache-bin: false
      - run: pnpm install --frozen-lockfile
      - name: Record toolchain
        shell: bash
        run: |
          {
            node --version
            pnpm --version
            rustc --version
            cargo --version
            java -version
            javac -version
            node -e 'const os=require("node:os"); console.log(JSON.stringify({platform:os.platform(),arch:os.arch(),release:os.release(),version:os.version()}))'
          } 2>&1 | tee ci-evidence/toolchain.txt
      - name: Check formatting
        shell: bash
        run: pnpm format:check 2>&1 | tee ci-evidence/format.log
      - name: Host tests
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UTERM_INPUT_CONTROL_REPORT: ${{ github.workspace }}/ci-evidence/input-control-host.json
          UTERM_TASK_OUTPUT_AUTH_REPORT: ${{ github.workspace }}/ci-evidence/task-output-auth.json
        run:
          cargo test --manifest-path crates/utermd-local/Cargo.toml --locked 2>&1 | tee
          ci-evidence/host-tests.log
      - name: Java launcher encoding diagnostics
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/java-launcher-probe.mjs ci-evidence/java-launcher-probe.json
      - name: Shared core tests
        id: shared-core
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UTERM_TERMINAL_LOAD_REPORT: ${{ github.workspace }}/ci-evidence/terminal-load-core.json
          UTERM_JAVA_CORE_REPORT: ${{ github.workspace }}/ci-evidence/java-live-core.json
          UTERM_INPUT_CONTROL_CORE_REPORT:
            ${{ github.workspace }}/ci-evidence/input-control-core.json
          UTERM_INPUT_REACQUIRE_REPORT:
            ${{ github.workspace }}/ci-evidence/input-reacquire-core.json
          UTERM_M2_SIMULATION_REPORT: ${{ github.workspace }}/ci-evidence/m2-simulation-core.json
          UTERM_SSH_CONFIGURATION_REPORT:
            ${{ github.workspace }}/ci-evidence/ssh-configuration-core.json
          UTERM_SSH_SERVICE_REPORT: ${{ github.workspace }}/ci-evidence/ssh-service-core.json
          UTERM_GIT_CORE_REPORT: ${{ github.workspace }}/ci-evidence/git-operations-core.json
          UTERM_AGENT_CORE_REPORT: ${{ github.workspace }}/ci-evidence/agent-hooks-core.json
          UTERM_ROLLBACK_EXPORT_REPORT:
            ${{ github.workspace }}/ci-evidence/rollback-export-core.json
        run: pnpm test:core 2>&1 | tee ci-evidence/core-ffi-tests.log
      - name: Generated contracts
        shell: bash
        run: pnpm contracts:check 2>&1 | tee ci-evidence/contracts.log
      - name: Real SSH service and public Core client workflows
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cargo build --locked --manifest-path crates/uterm-core/Cargo.toml --bin uterm-core-contract
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          python scripts/ssh-core-qa.py "${CARGO_TARGET_DIR:-crates/uterm-core/target}/debug/uterm-core-contract$suffix" ci-evidence/ssh-live
      - name: Immutable release helper compatibility
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm test:legacy-host 2>&1 | tee ci-evidence/legacy-host-command.log
      - name: Documentation check
        shell: bash
        run: pnpm docs:check 2>&1 | tee ci-evidence/docs.log
      - name: Frontend tests
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UTERM_SETTINGS_REPORT: ${{ github.workspace }}/ci-evidence/settings-platform.json
        run: pnpm test 2>&1 | tee ci-evidence/frontend-tests.log
      - name: Backend tests
        shell: bash
        run:
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee
          ci-evidence/backend-tests.log
      - name: Desktop build
        shell: bash
        run:
          node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle -- --locked 2>&1 |
          tee ci-evidence/desktop-build.log
      - name: Isolated native shared-state, SSH and Redis QA
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/ssh-tauri-qa.py 2>&1 | tee ci-evidence/tauri-state-qa-run.log
      - name: Ordinary macOS workspace parity screenshot grid
        if: runner.os == 'macOS'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UTERM_QA_UI_PARITY_ONLY: "1"
        run: |
          swift scripts/macos-qa-display.swift | tee ci-evidence/ui-parity-display.json
          swift scripts/macos-qa-display.swift --verify-only | tee ci-evidence/ui-parity-display-verified.json
          node scripts/tauri-state-qa.mjs --skip-build 2>&1 | tee ci-evidence/ui-parity-command.log
      - name: Isolated Windows candidate installer, actual launch and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run:
          ./scripts/windows-candidate-package.ps1 *>&1 | Tee-Object -FilePath
          ci-evidence/candidate-package-command.log
      - name: Preserve shared Core failure
        if: ${{ always() && steps.shared-core.outcome == 'failure' }}
        shell: bash
        run: |
          echo "Shared Core tests failed; see core-ffi-tests.log. Independent QA does not waive this failure." | tee ci-evidence/core-failure.txt
          exit 1
      - name: Audit source-bound desktop interaction matrix
        if: always()
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -B tests/test_interaction_matrix.py
          node --test tests/terminal-composition.test.mjs tests/terminal-input.test.mjs 2>&1 | tee ci-evidence/input-simulation-tests.log
          python -B scripts/interaction-matrix.py tauri ci-evidence/tauri-state-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name:
            legacy-checks-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence/
          if-no-files-found: error

  ui-parity-evidence:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wait for same-source Personal ARM64 evidence
        id: personal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(python3 -B scripts/ui-parity-evidence.py find-native-run "$GITHUB_REPOSITORY" "$SOURCE_HEAD" "uTerm-Personal-ARM64-$SOURCE_HEAD")
          echo "run=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: legacy-checks-macos-15-${{ env.SOURCE_HEAD }}
          path: ci-input/tauri
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.personal.outputs.run }}
          name: uTerm-Personal-ARM64-${{ env.SOURCE_HEAD }}
          path: ci-input/native
      - name: Validate original images, source identities and matching scene grid
        run: |
          python3 -B -m unittest discover -s tests -p 'test_ui_parity_*.py'
          python3 -B scripts/ui-parity-evidence.py compare --native ci-input/native/personal-initial.json --tauri ci-input/tauri/ui-parity-tauri/report.json --output ci-evidence/paired-ui --head "$SOURCE_HEAD" --tested "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        id: comparison
        with:
          name: ui-parity-originals-${{ env.SOURCE_HEAD }}
          path: ci-evidence/paired-ui/
          if-no-files-found: error
          retention-days: 90
      - name: Link paired original screenshots
        env:
          EVIDENCE_URL: ${{ steps.comparison.outputs.artifact-url }}
        run: |
          echo "[Original paired screenshots / 原始成对截图]($EVIDENCE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Eight workspace and twenty-four settings pairs; full functional acceptance remains pending. 八组工作区及二十四组设置对照，完整功能验收仍待完成。" >> "$GITHUB_STEP_SUMMARY"
