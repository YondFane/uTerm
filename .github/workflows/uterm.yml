name: uTerm

on:
  workflow_dispatch:
  pull_request:
    branches: [release]
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.22.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path crates/utermd-local/Cargo.toml --check
      - run: cargo test --manifest-path crates/utermd-local/Cargo.toml --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle -- --locked
