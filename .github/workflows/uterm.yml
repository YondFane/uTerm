name: uTerm

on:
  workflow_dispatch:
  pull_request:
    branches: [release]
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.22.0
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}-${{ runner.arch }}
          workspaces: |
            src-tauri -> target
            crates/utermd-local -> target
          cache-bin: false
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - run: cargo test --manifest-path crates/utermd-local/Cargo.toml --locked
      - run: pnpm docs:check
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: node node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle -- --locked
