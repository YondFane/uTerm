name: uTerm build cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uterm-build-cache
  cancel-in-progress: true

jobs:
  warm-cache:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rust: aarch64-apple-darwin
          - os: macos-15-intel
            rust: x86_64-apple-darwin
          - os: windows-latest
            rust: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Seed default-branch caches from release so subsequent version tags can restore them.
      # 从 release 预热默认分支缓存，供后续版本标签恢复。
      - uses: actions/checkout@v7
        with:
          ref: release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.22.0
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}-${{ runner.arch }}
          workspaces: |
            src-tauri -> target
            crates/utermd-local -> target
            crates/uterm-core -> target
            crates/uterm-ffi -> target
          cache-bin: false
      - run: pnpm install --frozen-lockfile
      - name: Compile host test dependencies
        run: cargo test --manifest-path crates/utermd-local/Cargo.toml --locked --no-run
      - name: Compile shared core and FFI test dependencies
        run: |
          cargo test --manifest-path crates/uterm-core/Cargo.toml --locked --no-run
          cargo test --manifest-path crates/uterm-ffi/Cargo.toml --locked --no-run
      - name: Compile desktop test dependencies
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-run
      - name: Compile release dependencies without packaging
        run: |
          node node_modules/@tauri-apps/cli/tauri.js build --ci --no-bundle \
            --target '${{ matrix.rust }}' -- --locked

  warm-personal-cache:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.22.0
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Select Xcode and identify native dependency toolchain
        id: native-toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          native_toolchain=$( { xcodebuild -version; swift --version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$native_toolchain" >> "$GITHUB_OUTPUT"
      - name: Cache personal Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: personal-${{ matrix.os }}-${{ runner.arch }}
          key: ${{ steps.native-toolchain.outputs.key }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          workspaces: |
            crates/utermd-local -> target
            crates/uterm-core -> target
            crates/uterm-ffi -> target
          cache-bin: false
      - name: Cache SwiftPM dependencies only
        uses: actions/cache@v4
        with:
          path: |
            macos/.build/personal-build/repositories
            macos/.build/personal-build/checkouts
            macos/.build/personal-build/artifacts
            macos/.build/personal-build/workspace-state.json
          key: swiftpm-personal-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.key }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}
      - name: Compile personal Rust dependencies and resolve locked SwiftPM packages
        run: |
          cargo build --locked --release --manifest-path crates/uterm-ffi/Cargo.toml
          cargo build --locked --release --manifest-path crates/utermd-local/Cargo.toml --bin utermd-local
          cargo build --locked --manifest-path crates/uterm-core/Cargo.toml --bin uterm-core-contract
          swift package --package-path macos --scratch-path "$PWD/macos/.build/personal-build" --force-resolved-versions resolve
          git diff --exit-code -- macos/Package.resolved
