name: Shared database services

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.11@sha256:468e1f126ca5af849799cda06ac9b03d8090aae9fa5163408b3e8da44fad0702
        env:
          POSTGRES_USER: uterm_qa
          POSTGRES_DB: uterm_qa
          POSTGRES_PASSWORD: isolated-ci-fixture-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U uterm_qa -d uterm_qa" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UTERM_DATABASE_TEST_PASSWORD: isolated-ci-fixture-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pinned protocol-test dependencies
        run: |
          npm install --global pnpm@11.22.0
          pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: database-core-linux
          workspaces: crates/uterm-core -> target
          cache-bin: false
      - name: Record exact source and toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uterm-database"
          echo "UTERM_DATABASE_TEST_DRIVER=$RUNNER_TEMP/uterm-database/postgresql.jar" >> "$GITHUB_ENV"
          echo "UTERM_DATABASE_TEST_REPORT=$RUNNER_TEMP/uterm-database/database-postgresql.json" >> "$GITHUB_ENV"
          {
            echo "pr_head=$PR_HEAD_SHA"
            echo "tested_commit=$(git rev-parse HEAD)"
            uname -a
            rustc --version
            cargo --version
            java -version
          } 2>&1 | tee "$RUNNER_TEMP/uterm-database/toolchain.txt"
      - name: Download catalog-verified JDBC driver
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          artifact = json.loads(Path('components/database/catalog.json').read_text())['drivers']['postgresql']
          driver = Path(os.environ['UTERM_DATABASE_TEST_DRIVER'])
          subprocess.run(['curl', '--fail', '--location', '--retry', '3', '--silent', '--show-error', '--output', str(driver), artifact['url']], check=True)
          assert driver.stat().st_size == artifact['size'], 'Catalog driver size mismatch'
          assert hashlib.sha256(driver.read_bytes()).hexdigest() == artifact['sha256'], 'Catalog driver digest mismatch'
          PY
      - name: Asynchronous protocol and close-race regressions
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path crates/uterm-core/Cargo.toml --test database_client 2>&1 | tee "$RUNNER_TEMP/uterm-database/database-client-tests.log"
      - name: Component recovery and document protocol simulations
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path crates/uterm-core/Cargo.toml --lib database 2>&1 | tee "$RUNNER_TEMP/uterm-database/database-components-tests.log"
          python3 -B scripts/database-protocol-qa.py "$RUNNER_TEMP/uterm-database"
      - name: Real PostgreSQL values, transactions, conflicts and cancellation
        env:
          UTERM_DATABASE_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path crates/uterm-core/Cargo.toml --test database_client real_postgresql_exact_values_conflicts_transactions_and_cancel -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/uterm-database/database-postgresql-tests.log"
      - name: Upload source-bound database reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: database-core-linux-${{ env.PR_HEAD_SHA }}
          path: |
            ${{ runner.temp }}/uterm-database/*.json
            ${{ runner.temp }}/uterm-database/*.txt
            ${{ runner.temp }}/uterm-database/*.log
          if-no-files-found: error
          retention-days: 30
