name: Maven workflow interoperability

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-workflows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, java: "8" }
          - { os: windows-latest, java: "11" }
          - { os: windows-latest, java: "17" }
          - { os: windows-latest, java: "21" }
          - { os: macos-15, java: "21" }
          - { os: macos-15-intel, java: "21" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UTERM_MAVEN_CORE_REPORT: ${{ github.workspace }}/ci-evidence/maven-live-core.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: maven-workflow-${{ matrix.os }}-${{ runner.arch }}
          workspaces: |
            crates/utermd-local -> target
            crates/uterm-core -> target
          cache-bin: false
      - name: Install verified Maven into the temporary QA directory
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          base = 'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip'
          archive = urllib.request.urlopen(base, timeout=60).read()
          expected = urllib.request.urlopen(base + '.sha512', timeout=60).read().decode().split()[0]
          assert hashlib.sha512(archive).hexdigest() == expected
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uterm-maven-tool'
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              source.extractall(root)
          home = root / 'apache-maven-3.9.9'
          assert (home / 'bin/m2.conf').is_file()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('UTERM_MAVEN_HOME=' + str(home) + '\n')
              output.write('UTERM_MAVEN_REPOSITORY=' + str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'uterm-maven-repository') + '\n')
          pathlib.Path('ci-evidence').mkdir()
          pathlib.Path('ci-evidence/maven-tool.json').write_text(
              __import__('json').dumps({'version': '3.9.9', 'sha512': expected, 'source': base}, indent=2))
          PY
      - uses: actions/cache@v4
        with:
          path: ${{ env.UTERM_MAVEN_REPOSITORY }}
          key: maven-3.9.9-boot-2.7.18-${{ runner.os }}-${{ matrix.java }}-${{ hashFiles('tests/fixtures/maven-live/**') }}
      - name: Record source and toolchain
        run: |
          {
            echo "pr_head=$PR_HEAD_SHA"
            echo "tested_commit=$(git rev-parse HEAD)"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            rustc --version
            cargo --version
            java -version
            javac -version
            python3 -c "import platform; print(platform.platform())"
          } 2>&1 | tee ci-evidence/source-toolchain.txt
      - name: Build the standalone task host
        run: cargo build --locked --manifest-path crates/utermd-local/Cargo.toml --bin utermd-local 2>&1 | tee ci-evidence/host-build.log
      - name: Real Maven reactor and Spring Boot task workflows
        run: cargo test --locked --manifest-path crates/uterm-core/Cargo.toml --test host real_maven_reactor_and_spring_boot_use_shared_task_lifetimes -- --ignored --nocapture 2>&1 | tee ci-evidence/maven-host-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-interop-${{ matrix.os }}-jdk-${{ matrix.java }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence/
          if-no-files-found: error
