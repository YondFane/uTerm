name: macOS personal packages

on:
  pull_request:
    branches: [release]
    paths:
      - macos/**
      - crates/**
      - src/**
      - shared/**
      - scripts/macos-native-test.sh
      - scripts/macos-native-build.sh
      - scripts/macos-personal-*
      - scripts/macos_disk_image.py
      - scripts/macos_qa_http.py
      - scripts/macos-qa-display.swift
      - scripts/macos-qa-capture-probe.swift
      - scripts/macos-updates-smoke.py
      - scripts/personal-updates.mjs
      - tests/test_macos_personal.py
      - tests/test_macos_disk_image.py
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/macos-personal.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
      source_sha:
        type: string
        default: ""
      updater_public_key:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  personal:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      PR_HEAD_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.22.0
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-
      - name: Install pinned frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - name: Select Xcode and record exact source
        id: native-toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          mkdir -p macos/.build/personal-packages
          {
            echo "source_head=$PR_HEAD_SHA"
            echo "tested_commit=$(git rev-parse HEAD)"
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            rustc --version
            pnpm --version
          } 2>&1 | tee macos/.build/personal-packages/toolchain.txt
          native_toolchain=$( { xcodebuild -version; swift --version; xcrun --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$native_toolchain" >> "$GITHUB_OUTPUT"
      - name: Prepare real-window capture display
        run: |
          swift scripts/macos-qa-display.swift | tee macos/.build/personal-packages/display.json
          swift scripts/macos-qa-display.swift --verify-only | tee macos/.build/personal-packages/display-verified.json
      - name: Probe capture infrastructure before personal compilation
        continue-on-error: true
        timeout-minutes: 2
        run: |
          swiftc -parse-as-library macos/Sources/UTermBridge/WindowCaptureAlpha.swift scripts/macos-qa-capture-probe.swift -o "$RUNNER_TEMP/uterm-capture-probe"
          UTERM_QA_TESTED_SHA="$(git rev-parse HEAD)" "$RUNNER_TEMP/uterm-capture-probe" "$PWD/macos/.build/personal-packages/capture-probe"
      - name: Preserve personal capture infrastructure diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: personal-capture-probe-${{ matrix.os }}-${{ env.PR_HEAD_SHA }}-${{ github.run_attempt }}
          path: macos/.build/personal-packages/capture-probe/
          if-no-files-found: warn
      - name: Restore personal Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: personal-${{ matrix.os }}-${{ runner.arch }}
          key: ${{ steps.native-toolchain.outputs.key }}
          env-vars: MACOSX_DEPLOYMENT_TARGET
          save-if: false
          workspaces: |
            crates/utermd-local -> target
            crates/uterm-core -> target
            crates/uterm-ffi -> target
          cache-bin: false
      - name: Restore SwiftPM dependencies only
        uses: actions/cache/restore@v4
        with:
          path: |
            macos/.build/personal-build/repositories
            macos/.build/personal-build/checkouts
            macos/.build/personal-build/artifacts
            macos/.build/personal-build/workspace-state.json
          key: swiftpm-personal-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.key }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}
      - name: Verify package rejection rules and shell syntax
        run: |
          bash -n scripts/macos-native-build.sh
          python3 -B -m unittest discover -s tests -p 'test_macos_*.py'
      - name: Configure public updater identity or isolated CI test key
        env:
          RELEASE_PUBLIC_KEY: ${{ inputs.updater_public_key }}
        run: |
          if [ -n "$RELEASE_PUBLIC_KEY" ]; then
            echo "PERSONAL_UPDATER_PUBLIC_KEY=$RELEASE_PUBLIC_KEY" >> "$GITHUB_ENV"
          else
            node scripts/personal-updates.mjs keygen "$RUNNER_TEMP/personal-updater-test-key"
            echo "PERSONAL_UPDATER_PUBLIC_KEY=$(cat "$RUNNER_TEMP/personal-updater-test-key/public-key.txt")" >> "$GITHUB_ENV"
          fi
      - name: Build personal Swift and Rust Release app with ad-hoc signature
        run: bash scripts/macos-native-build.sh personal 2>&1 | tee
          macos/.build/personal-packages/build.log
      - name: Existing bridge and personal profile boundary regressions
        run: bash scripts/macos-native-test.sh personal 2>&1 | tee
          macos/.build/personal-packages/swift-tests.log
      - name: Audit DMG and ZIP, run isolated real window and same-source app replacement
        run: python3 -B scripts/macos-personal-package.py --smoke 2>&1 | tee
          macos/.build/personal-packages/package-command.log
      - name: Actual personal Sparkle downloads, rejection, retry, automatic scheduling and installation
        run: |
          cargo build --locked --manifest-path crates/uterm-core/Cargo.toml --bin uterm-core-contract
          python3 -B scripts/macos-updates-smoke.py --personal 2>&1 | tee macos/.build/personal-packages/updates-command.log
      - name: Downloadable personal packages, exact reports and original screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uTerm-Personal-${{ runner.arch }}-${{ env.PR_HEAD_SHA }}
          path: macos/.build/personal-packages/
          if-no-files-found: error
          retention-days: 90
