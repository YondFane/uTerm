name: Java launcher interoperability

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-launcher:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21]
    defaults:
      run:
        shell: bash
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      UTERM_JAVA_CORE_REPORT: ${{ github.workspace }}/ci-evidence/java-live-core.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: java-launcher-windows-${{ runner.arch }}
          workspaces: |
            crates/utermd-local -> target
            crates/uterm-core -> target
          cache-bin: false
      - name: Record source and actual JDK
        run: |
          mkdir -p ci-evidence
          {
            echo "pr_head=$PR_HEAD_SHA"
            echo "tested_commit=$(git rev-parse HEAD)"
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            rustc --version
            cargo --version
            java -version
            javac -version
          } 2>&1 | tee ci-evidence/source-toolchain.txt
      - name: Build the manifested host and launcher child
        run: cargo build --locked --manifest-path crates/utermd-local/Cargo.toml --bin utermd-local 2>&1 | tee ci-evidence/host-build.log
      - name: Verify embedded Java 8 encoding agent
        if: matrix.java == 21
        run: python scripts/java8-encoding-agent.py --check
      - name: Argument boundary regressions
        run: cargo test --locked --manifest-path crates/utermd-local/Cargo.toml --lib java_utf8::tests 2>&1 | tee ci-evidence/argument-tests.log
      - name: Selected JVM encoding diagnostics
        env:
          UTERM_JAVA_ENCODING_REPORT: ${{ github.workspace }}/ci-evidence/java-encoding-diagnostics.json
        run: cargo test --locked --manifest-path crates/uterm-core/Cargo.toml --test host selected_jvm_reports_encoding_for_ascii_and_unicode_jar_paths -- --ignored --nocapture 2>&1 | tee ci-evidence/java-encoding-diagnostics.log
      - name: Actual Unicode JAR, replay, final bytes and stop
        run: cargo test --locked --manifest-path crates/uterm-core/Cargo.toml --test host java_jar_uses_shared_host_literal_arguments_replay_and_generation_safe_stop -- --nocapture 2>&1 | tee ci-evidence/java-host-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-interop-windows-jdk-${{ matrix.java }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence/
          if-no-files-found: error
