name: Native migration

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pinned frontend toolchain
        run: |
          npm install --global pnpm@11.22.0
          pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.os }}-${{ runner.arch }}
          workspaces: |
            crates/utermd-local -> target
            crates/uterm-core -> target
            crates/uterm-ffi -> target
          cache-bin: false
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Record source and toolchain
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p macos/.build/evidence
          cp docs/native-migration.md macos/.build/evidence/
          cp shared/contracts/tauri-baseline.json macos/.build/evidence/
          {
            echo "pr_head=$PR_HEAD_SHA"
            echo "tested_commit=$(git rev-parse HEAD)"
            sw_vers
            xcodebuild -version
            swift --version
            rustc --version
            cargo --version
          } | tee macos/.build/evidence/toolchain.txt
      - name: Build isolated native application
        run: bash scripts/macos-native-build.sh 2>&1 | tee macos/.build/evidence/native-build.log
      - name: Shared core, FFI and Swift bridge tests
        run: |
          cargo build --locked --manifest-path crates/utermd-local/Cargo.toml --bin utermd-local
          cargo test --locked --manifest-path crates/uterm-core/Cargo.toml 2>&1 | tee macos/.build/evidence/core-tests.log
          cargo test --locked --manifest-path crates/uterm-core/Cargo.toml --test persistence filesystem_failure_preserves_snapshot_and_allows_retry -- --include-ignored 2>&1 | tee macos/.build/evidence/core-io-test.log
          cargo test --locked --manifest-path crates/uterm-ffi/Cargo.toml 2>&1 | tee macos/.build/evidence/ffi-tests.log
          bash scripts/macos-native-test.sh 2>&1 | tee macos/.build/evidence/swift-tests.log
      - name: Real window and graceful exit smoke
        run: bash scripts/macos-native-smoke.sh
      - name: Real native PTY, split, detach and replay smoke
        run: bash scripts/macos-terminal-smoke.sh
      - name: Real native content and resource boundary smoke
        run: bash scripts/macos-content-smoke.sh
      - name: Real native control and standalone CLI smoke
        run: bash scripts/macos-control-smoke.sh
      - name: Record resolved native dependencies
        if: always()
        run: if [ -f macos/Package.resolved ]; then cp macos/Package.resolved macos/.build/evidence/Package.resolved; fi
      - name: Archive QA application
        run: ditto -c -k --sequesterRsrc --keepParent macos/.build/qa/UTermNativeQA.app macos/.build/evidence/UTermNativeQA.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qa-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: macos/.build/evidence/
          if-no-files-found: error
