name: uTerm release

on:
  push:
    tags: ["uTerm-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as uTerm-v0.1.0"
        required: true
        type: string
      recovery_run_id:
        description: "Restore publication for an already public tag from its successful build run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: uterm-stable-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}
      - name: Require a version tag from release
        id: source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^uTerm-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag.'; exit 1; }
          git fetch origin refs/heads/release:refs/remotes/origin/release --tags
          COMMIT=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/release || {
            echo 'Release tag must point to a commit on origin/release.'
            exit 1
          }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate release version and bilingual notes
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import { releaseVersion, releaseNotes } from './scripts/release.mjs';
          const version = releaseVersion(process.env.RELEASE_TAG);
          for (const path of ['package.json', 'src-tauri/tauri.conf.json']) {
            if (JSON.parse(readFileSync(path, 'utf8')).version !== version) throw new Error(`Version mismatch: ${path}`);
          }
          for (const path of ['src-tauri/Cargo.toml', 'src-tauri/Cargo.lock']) {
            const source = readFileSync(path, 'utf8');
            if (!source.includes(`name = "uterm"\nversion = "${version}"`)) throw new Error(`Version mismatch: ${path}`);
          }
          const notes = process.env.DESKTOP_RELEASE_NOTES || releaseNotes(process.env.RELEASE_TAG);
          if (!notes.startsWith(`# uTerm ${version}\n`) || !notes.includes('## 中文') || !notes.includes('## English')) throw new Error('Missing versioned bilingual release notes');
          JS
      - name: Require personal updater signing configuration
        env:
          PERSONAL_UPDATER_PRIVATE_KEY: ${{ secrets.PERSONAL_UPDATER_PRIVATE_KEY }}
          PERSONAL_UPDATER_PUBLIC_KEY: ${{ vars.PERSONAL_UPDATER_PUBLIC_KEY }}
        run: |
          node --input-type=module - <<'JS'
          import { signPersonalArchive } from './scripts/personal-updates.mjs';
          signPersonalArchive(Buffer.from('Personal updater configuration check'), process.env.PERSONAL_UPDATER_PRIVATE_KEY, process.env.PERSONAL_UPDATER_PUBLIC_KEY);
          JS
  build:
    if: ${{ !inputs.recovery_run_id }}
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rust: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            rust: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: windows-latest
            rust: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.22.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-11-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-11-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
          components: rustfmt
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}-${{ runner.arch }}
          save-if: false
          workspaces: |
            src-tauri -> target
            crates/utermd-local -> target
            crates/uterm-core -> target
            crates/uterm-ffi -> target
          cache-bin: false
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - run: pnpm docs:check && pnpm test
      - run: cargo test --manifest-path crates/utermd-local/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.DESKTOP_WINDOWS_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE) {
            Write-Host 'No Windows code-signing certificate configured; updater signing remains required.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Configure stable update channel
        env:
          DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATER_PUBLIC_KEY }}
        run: node scripts/release.mjs configure "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release.json"
      - name: Build installer and sign updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATER_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node scripts/tauri-build.mjs --ci --target '${{ matrix.rust }}' --bundles '${{ matrix.bundles }}' --config "$RUNNER_TEMP/desktop-release.json" -- --locked
          node scripts/release.mjs collect "$RELEASE_TAG" '${{ matrix.platform }}' 'src-tauri/target/${{ matrix.rust }}/release/bundle' "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: uterm-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  personal:
    if: ${{ !inputs.recovery_run_id }}
    needs: validate-source
    uses: ./.github/workflows/macos-personal.yml
    with:
      source_ref: ${{ inputs.tag || github.ref_name }}
      source_sha: ${{ needs.validate-source.outputs.commit }}
      updater_public_key: ${{ vars.PERSONAL_UPDATER_PUBLIC_KEY }}

  publish:
    if: ${{ !inputs.recovery_run_id }}
    needs: [validate-source, build, personal]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE_SHA: ${{ needs.validate-source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: uterm-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: uTerm-Personal-*
          path: personal-packages
      - name: Collect verified personal Mac packages from the release commit
        env:
          PERSONAL_UPDATER_PUBLIC_KEY: ${{ vars.PERSONAL_UPDATER_PUBLIC_KEY }}
        run:
          node scripts/release.mjs collect-personal "$RELEASE_TAG" "$RELEASE_SOURCE_SHA"
          personal-packages release
      - name: Sign separate personal Mac update feeds
        env:
          PERSONAL_UPDATER_PRIVATE_KEY: ${{ secrets.PERSONAL_UPDATER_PRIVATE_KEY }}
          PERSONAL_UPDATER_PUBLIC_KEY: ${{ vars.PERSONAL_UPDATER_PUBLIC_KEY }}
        run:
          node scripts/release.mjs personal-feeds "$RELEASE_TAG" "$RELEASE_SOURCE_SHA"
          personal-packages release
      - name: Validate release and existing feed
        run: |
          test "$(gh repo view --json isPrivate --jq .isPrivate)" = false || { echo 'Updater downloads require a public repository.'; exit 1; }
          VERSION="${RELEASE_TAG#uTerm-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Distinguish a missing release from authentication and network failures.
          STATUS=$(curl --silent --show-error --retry 3 --output existing.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$STATUS" = 404 || { echo "Release already exists or lookup failed (HTTP $STATUS). Use a new version tag if it exists."; exit 1; }
          STATUS=$(curl --silent --show-error --retry 3 --output channel.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/uTerm-updates")
          if [ "$STATUS" = 200 ]; then
            echo 'CHANNEL_EXISTS=true' >> "$GITHUB_ENV"
          elif [ "$STATUS" = 404 ]; then
            echo 'CHANNEL_EXISTS=false' >> "$GITHUB_ENV"
          else
            echo "Update channel lookup failed (HTTP $STATUS)."
            exit 1
          fi
      - name: Generate platform update feeds
        run: |
          for TARGET in windows-x86_64 darwin-aarch64 darwin-x86_64; do
            FEED=$(node --input-type=module -e 'import { feedFilename } from "./scripts/release.mjs"; console.log(feedFilename(process.argv[1]));' "$TARGET")
            PREVIOUS=-
            if [ "$CHANNEL_EXISTS" = true ] && jq -e --arg name "$FEED" '.assets | any(.name == $name)' channel.json > /dev/null; then
              PREVIOUS="previous-$TARGET.json"
              gh release download uTerm-updates --pattern "$FEED" --output "$PREVIOUS"
            fi
            node scripts/release.mjs manifest "$RELEASE_TAG" release "$PREVIOUS" "$TARGET"
          done
      - name: Publish version installers and update archives
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          import { releaseBase, releaseNotes } from './scripts/release.mjs';
          const version = process.env.VERSION;
          const root = `${releaseBase()}/${process.env.RELEASE_TAG}/uTerm-${version}`;
          writeFileSync('release-notes.md', `${releaseNotes(process.env.RELEASE_TAG)}\n\n## 下载 / Downloads\n\n- [Windows x64](${root}-windows-x86_64-setup.exe)\n- [macOS Apple Silicon](${root}-darwin-aarch64.dmg)\n- [macOS Intel](${root}-darwin-x86_64.dmg)\n- [macOS 原生个人版 / Native Personal · Apple Silicon](${root}-personal-darwin-aarch64.dmg)\n- [macOS 原生个人版 / Native Personal · Intel](${root}-personal-darwin-x86_64.dmg)\n- [个人版校验和 / Personal checksums](${root}-personal-SHA256SUMS.txt)\n\nmacOS 版本使用临时签名，未经 Apple 公证。首次启动可能需要在“隐私与安全”中批准。\n\nThe macOS build uses temporary signing and is not notarized by Apple. The first launch may require approval in Privacy & Security.\n`);
          JS
          gh release create "$RELEASE_TAG" release/uTerm-* release/latest*.json release/personal-stable-*.xml \
            --verify-tag --draft --latest=false --title "uTerm $VERSION" --notes-file release-notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > draft-releases.json
          RELEASE_ID=$(node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const matches = JSON.parse(readFileSync('draft-releases.json', 'utf8')).filter(value => value.tag_name === process.env.RELEASE_TAG && value.draft);
          if (matches.length !== 1 || !Number.isSafeInteger(matches[0].id)) throw new Error('Expected exactly one matching draft release');
          console.log(matches[0].id);
          JS
          )
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=false
      - name: Verify public downloads
        run: |
          for TARGET in windows-x86_64 darwin-aarch64 darwin-x86_64; do
            node scripts/release.mjs verify "$RELEASE_TAG" release "$TARGET"
          done
      - name: Verify personal public downloads
        run: |
          for FILE in release/uTerm-*-personal-* release/personal-stable-*.xml; do
            gh release download "$RELEASE_TAG" --pattern "$(basename "$FILE")" --output "$RUNNER_TEMP/$(basename "$FILE")"
            cmp "$FILE" "$RUNNER_TEMP/$(basename "$FILE")"
          done
      - name: Publish stable update feed
        run: |
          if [ "$CHANNEL_EXISTS" = true ]; then
            gh release upload uTerm-updates release/latest*.json release/personal-stable-*.xml --clobber
          else
            printf '%s\n' '## 中文' '' 'uTerm 稳定更新清单。请从对应版本的 uTerm Release 下载安装包。' '' '## English' '' 'Stable uTerm update manifest. Download installers from the matching versioned uTerm release.' > channel-notes.md
            gh release create uTerm-updates release/latest*.json release/personal-stable-*.xml --target "$(git rev-parse HEAD)" \
              --prerelease --latest=false --title 'uTerm update channel' --notes-file channel-notes.md
          fi
      - name: Mark stable version as latest
        run: gh release edit "$RELEASE_TAG" --latest=true

  recover-publication:
    if: ${{ inputs.recovery_run_id }}
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.recovery_run_id }}
      RELEASE_SOURCE_SHA: ${{ needs.validate-source.outputs.commit }}
      RECOVERY_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate successful source builds and published version
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p recovery/version recovery/channel
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > recovery/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > recovery/source-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > recovery/release.json
          python3 - <<'PYREC'
          import json, os, pathlib
          root=pathlib.Path('recovery')
          run=json.loads((root/'source-run.json').read_text()); jobs=json.loads((root/'source-jobs.json').read_text())['jobs']
          assert run['head_sha']==os.environ['RELEASE_SOURCE_SHA'] and run['name']=='uTerm release' and run['event']=='push'
          builds=[j for j in jobs if j['name'].startswith('build (') or j['name'].startswith('personal / personal (')]
          assert len(builds)==5 and all(j['conclusion']=='success' for j in builds)
          release=json.loads((root/'release.json').read_text())
          assert not release['draft'] and not release['prerelease'] and release['tag_name']==os.environ['RELEASE_TAG'] and len(release['assets'])==18
          notes=pathlib.Path('release-notes',os.environ['RELEASE_TAG']+'.md').read_text().strip()
          assert release['body'].startswith(notes)
          report=dict(passed=False,sourceSHA=os.environ['RELEASE_SOURCE_SHA'],sourceRun=int(os.environ['SOURCE_RUN']),recoveryWorkflowSHA=os.environ['RECOVERY_WORKFLOW_SHA'],successfulBuilds=[j['id'] for j in builds],releaseID=release['id'])
          (root/'report.json').write_text(json.dumps(report,indent=2))
          PYREC
      - name: Download and validate the immutable version feeds
        run: |
          gh release download "$RELEASE_TAG" --pattern 'latest*.json' --pattern 'personal-stable-*.xml' --dir recovery/version
          python3 - <<'PYREC'
          import json, os, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('recovery'); release=json.loads((root/'release.json').read_text()); assets={a['name']:a for a in release['assets']}
          version=os.environ['RELEASE_TAG'].removeprefix('uTerm-v'); base='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/'+os.environ['RELEASE_TAG']+'/'
          notes=pathlib.Path('release-notes',os.environ['RELEASE_TAG']+'.md').read_text().strip()
          for target,file in [('windows-x86_64','latest.json'),('darwin-aarch64','latest-darwin-aarch64.json'),('darwin-x86_64','latest-darwin-x86_64.json')]:
              value=json.loads((root/'version'/file).read_text()); assert value['version']==version and value['notes']==notes
              item=value['platforms'][target]; installer=value['installers'][target]
              assert item['url'].startswith(base) and item['url'].removeprefix(base) in assets and item['signature']
              assert installer['url']==base+installer['filename'] and assets[installer['filename']]['size']==installer['size']
          for arch,target in [('arm64','darwin-aarch64'),('x86_64','darwin-x86_64')]:
              enclosure=ET.parse(root/'version'/('personal-stable-'+arch+'.xml')).find('./channel/item/enclosure'); assert enclosure is not None
              name='uTerm-'+version+'-personal-'+target+'.zip'
              assert enclosure.attrib['url']==base+name and int(enclosure.attrib['length'])==assets[name]['size']
              assert any(k.endswith('shortVersionString') and v==version for k,v in enclosure.attrib.items())
              assert any(k.endswith('edSignature') and v for k,v in enclosure.attrib.items())
          assert len(list((root/'version').iterdir()))==5
          PYREC
      - name: Restore verified stable feeds and Latest
        run: |
          gh release upload uTerm-updates recovery/version/* --clobber
          gh release download uTerm-updates --pattern 'latest*.json' --pattern 'personal-stable-*.xml' --dir recovery/channel
          python3 - <<'PYREC'
          from pathlib import Path
          for file in Path('recovery/version').iterdir():
              assert file.read_bytes()==(Path('recovery/channel')/file.name).read_bytes()
          PYREC
          RELEASE_ID=$(node -p "JSON.parse(require('fs').readFileSync('recovery/release.json')).id")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f make_latest=true
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > recovery/latest.json
          python3 - <<'PYREC'
          import json, os, pathlib, urllib.request
          root=pathlib.Path('recovery'); latest=json.loads((root/'latest.json').read_text()); assert latest['tag_name']==os.environ['RELEASE_TAG']
          links=[a['browser_download_url'] for a in latest['assets'] if a['name'].endswith('.dmg') or a['name'].endswith('setup.exe')]
          assert len(links)==5
          for url in links:
              with urllib.request.urlopen(urllib.request.Request(url,method='HEAD'),timeout=30) as response: assert response.status==200
          report=json.loads((root/'report.json').read_text()); report.update(passed=True,stableFeeds=5,publicInstallers=5,latest=latest['tag_name'])
          (root/'report.json').write_text(json.dumps(report,indent=2))
          PYREC
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-publication-recovery-${{ inputs.tag }}-${{ github.run_id }}
          path: recovery/
          if-no-files-found: error
