name: uTerm release

on:
  push:
    tags: ["uTerm-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as uTerm-v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: uterm-stable-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a version tag from release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^uTerm-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag.'; exit 1; }
          git fetch origin refs/heads/release:refs/remotes/origin/release --tags
          COMMIT=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/release || {
            echo 'Release tag must point to a commit on origin/release.'
            exit 1
          }
  build:
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rust: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            rust: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: windows-latest
            rust: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.22.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check && pnpm test
      - run: cargo test --manifest-path crates/utermd-local/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.DESKTOP_WINDOWS_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE) {
            Write-Host 'No Windows code-signing certificate configured; updater signing remains required.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Configure stable update channel
        env:
          DESKTOP_UPDATER_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATER_PUBLIC_KEY }}
        run: node scripts/release.mjs configure "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release.json"
      - name: Build installer and sign updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATER_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node node_modules/@tauri-apps/cli/tauri.js build --ci --target '${{ matrix.rust }}' --bundles '${{ matrix.bundles }}' --config "$RUNNER_TEMP/desktop-release.json" -- --locked
          node scripts/release.mjs collect "$RELEASE_TAG" '${{ matrix.platform }}' 'src-tauri/target/${{ matrix.rust }}/release/bundle' "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: uterm-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: uterm-*
          merge-multiple: true
          path: release
      - name: Validate release and existing feed
        run: |
          test "$(gh repo view --json isPrivate --jq .isPrivate)" = false || { echo 'Updater downloads require a public repository.'; exit 1; }
          VERSION="${RELEASE_TAG#uTerm-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Distinguish a missing release from authentication and network failures.
          STATUS=$(curl --silent --show-error --retry 3 --output existing.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$STATUS" = 404 || { echo "Release already exists or lookup failed (HTTP $STATUS). Use a new version tag if it exists."; exit 1; }
          STATUS=$(curl --silent --show-error --retry 3 --output channel.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/uTerm-updates")
          if [ "$STATUS" = 200 ]; then
            echo 'CHANNEL_EXISTS=true' >> "$GITHUB_ENV"
          elif [ "$STATUS" = 404 ]; then
            echo 'CHANNEL_EXISTS=false' >> "$GITHUB_ENV"
          else
            echo "Update channel lookup failed (HTTP $STATUS)."
            exit 1
          fi
      - name: Generate platform update feeds
        run: |
          for TARGET in windows-x86_64 darwin-aarch64 darwin-x86_64; do
            FEED=$(node --input-type=module -e 'import { feedFilename } from "./scripts/release.mjs"; console.log(feedFilename(process.argv[1]));' "$TARGET")
            PREVIOUS=-
            if [ "$CHANNEL_EXISTS" = true ] && jq -e --arg name "$FEED" '.assets | any(.name == $name)' channel.json > /dev/null; then
              PREVIOUS="previous-$TARGET.json"
              gh release download uTerm-updates --pattern "$FEED" --output "$PREVIOUS"
            fi
            node scripts/release.mjs manifest "$RELEASE_TAG" release "$PREVIOUS" "$TARGET"
          done
      - name: Publish version installers and update archives
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          import { releaseBase, releaseNotes } from './scripts/release.mjs';
          const version = process.env.VERSION;
          const root = `${releaseBase()}/${process.env.RELEASE_TAG}/uTerm-${version}`;
          writeFileSync('release-notes.md', `${releaseNotes(process.env.RELEASE_TAG)}\n\n## 下载 / Downloads\n\n- [Windows x64](${root}-windows-x86_64-setup.exe)\n- [macOS Apple Silicon](${root}-darwin-aarch64.dmg)\n- [macOS Intel](${root}-darwin-x86_64.dmg)\n\nmacOS 版本使用临时签名，未经 Apple 公证。首次启动可能需要在“隐私与安全”中批准。\n\nThe macOS build uses temporary signing and is not notarized by Apple. The first launch may require approval in Privacy & Security.\n`);
          JS
          gh release create "$RELEASE_TAG" release/uTerm-* release/latest*.json \
            --verify-tag --draft --latest=false --title "uTerm $VERSION" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
      - name: Verify public downloads
        run: |
          for TARGET in windows-x86_64 darwin-aarch64 darwin-x86_64; do
            node scripts/release.mjs verify "$RELEASE_TAG" release "$TARGET"
          done
      - name: Publish stable update feed
        run: |
          if [ "$CHANNEL_EXISTS" = true ]; then
            gh release upload uTerm-updates release/latest*.json --clobber
          else
            printf '%s\n' '## 中文' '' 'uTerm 稳定更新清单。请从对应版本的 uTerm Release 下载安装包。' '' '## English' '' 'Stable uTerm update manifest. Download installers from the matching versioned uTerm release.' > channel-notes.md
            gh release create uTerm-updates release/latest*.json --target "$(git rev-parse HEAD)" \
              --prerelease --latest=false --title 'uTerm update channel' --notes-file channel-notes.md
          fi
