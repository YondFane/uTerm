name: Client performance evidence

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: client-performance-${{ matrix.os }}-${{ runner.arch }}
          workspaces: |
            src-tauri -> target
            crates/utermd-local -> target
            crates/uterm-core -> target
            crates/uterm-ffi -> target
          cache-bin: false
      - name: Prepare toolchain and record exact source
        run: |
          npm install --global pnpm@11.22.0
          pnpm install --frozen-lockfile
          mkdir -p ci-evidence/performance
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            rustc --version
            cargo --version
            java -version
            node -e 'console.log(JSON.stringify({head:process.env.PR_HEAD_SHA,platform:process.platform,arch:process.arch,system:require("node:os").version()}))'
          } 2>&1 | tee ci-evidence/performance/toolchain.txt
          cargo build --locked --manifest-path crates/uterm-core/Cargo.toml --bin uterm-core-contract
      - name: Build native QA on Mac
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          swift scripts/macos-qa-display.swift | tee ci-evidence/performance/display.json
          swift scripts/macos-qa-display.swift --verify-only | tee ci-evidence/performance/display-verified.json
          bash scripts/macos-native-build.sh 2>&1 | tee ci-evidence/performance/native-build.log
          xcodebuild -version >> ci-evidence/performance/toolchain.txt
          swift --version >> ci-evidence/performance/toolchain.txt
      - name: Run the shared workload sequentially three times
        run: |
          performance_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            performance_python=python
            export UTERM_QA_GIT_BASH="$(cygpath -w "$BASH")"
          fi
          "$performance_python" -B scripts/client-performance-database.py
          node scripts/client-performance-report.mjs ci-evidence/performance
      - name: Archive actual measurements and original windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-performance-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ci-evidence/performance/
            ci-evidence/performance-native/
            ci-evidence/tauri-state-qa/
          if-no-files-found: error
